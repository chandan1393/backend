# ═══════════════════════════════════════════════════════════════════════════
# BASE CONFIGURATION — application.properties
#
# Profile-specific config lives in:
#   application-local.properties   ← local development
#   application-prod.properties    ← Railway production
#
# To run locally:   java -jar app.jar --spring.profiles.active=local
# Railway sets:     SPRING_PROFILES_ACTIVE=prod  (via railway.toml)
# ═══════════════════════════════════════════════════════════════════════════

# Active profile (overridden by env var SPRING_PROFILES_ACTIVE on Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Timezone — always UTC ────────────────────────────────────────────────────
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ── File Upload limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Mail — Resend SMTP (works in all profiles) ───────────────────────────────
# Set RESEND_API_KEY in Railway Variables (or override in local properties)
# username is always the literal string "resend"
# ── Email — Resend HTTP API (NOT SMTP) ───────────────────────────────────────
# Railway blocks outbound SMTP ports (465, 587). We use the Resend HTTP API
# over port 443 (HTTPS) which is always open on Railway.
# Set RESEND_API_KEY in Railway Variables. No other mail config needed.
# RESEND_API_KEY is read directly in EmailService via @Value.

# ── RabbitMQ — optional, app starts without it (outbox handles persistence) ──
# Set CLOUDAMQP_URL in Railway Variables
# If not set, RabbitMQ features are disabled but outbox rows remain PENDING
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=true
# Retry connecting to RabbitMQ — don't crash on startup if broker is unavailable
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000
spring.rabbitmq.template.retry.max-attempts=3
# Exclude RabbitMQ from health check — app should stay UP even when broker is down
management.health.rabbit.enabled=false

# ── App URLs ─────────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# JPA — safe defaults
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
